<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DC-Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --panel: #131722;
      --border: #232938;
      --text: #e6e9ef;
      --muted: #8b95a7;
      --accent: #5865f2;
      --green: #23a55a;
      --danger: #da373c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px;
    }
    .container { max-width: 1100px; margin: 0 auto; display: grid; gap: 20px; }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 1.25rem; font-weight: 600; }
    .icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .brand .icon { width: 24px; height: 24px; color: var(--accent); }
    form.add-form { display: flex; gap: 8px; flex-wrap: wrap; }
    input, button, select {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.9rem;
    }
    input { min-width: 240px; outline: none; }
    input:focus { border-color: var(--accent); }
    button {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      transition: opacity 0.15s, border-color 0.15s;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); }
    button.danger:hover { border-color: var(--danger); color: var(--danger); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .servers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .card.active { border-color: var(--accent); }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .server-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .server-avatar { width: 34px; height: 34px; border-radius: 50%; background: #1e2433; object-fit: cover; display: grid; place-items: center; flex-shrink: 0; }
    .server-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .server-code { font-size: 0.78rem; color: var(--muted); }
    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .metric-label { font-size: 0.75rem; color: var(--muted); display: flex; align-items: center; gap: 5px; }
    .metric-value { font-size: 1.25rem; font-weight: 600; margin-top: 2px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot.online { background: var(--green); }
    .dot.total { background: var(--accent); }
    .chart-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
    }
    .chart-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .range-group { display: flex; gap: 6px; }
    .range-group button.active { background: var(--accent); border-color: var(--accent); }
    .chart-wrap { position: relative; height: 340px; }
    .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
    .error-msg { color: #f87171; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        <span>DC-Analytics</span>
      </div>
      <form class="add-form" id="addForm">
        <input id="inviteInput" type="text" placeholder="Invite code or discord.gg/..." required />
        <button class="primary" type="submit">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          Track
        </button>
        <button type="button" id="collectBtn" title="Sync all now">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
          Sync
        </button>
      </form>
    </header>

    <div id="errorBox" class="error-msg" hidden></div>
    <div id="serversGrid" class="servers-grid"></div>

    <div class="chart-panel" id="chartPanel" hidden>
      <div class="chart-toolbar">
        <div>
          <strong id="chartTitle">-</strong>
          <div class="server-code" id="lastUpdated"></div>
        </div>
        <div class="range-group" id="rangeGroup">
          <button data-hours="24" class="active">24h</button>
          <button data-hours="168">7d</button>
          <button data-hours="720">30d</button>
          <button data-hours="0">All</button>
        </div>
      </div>
      <div class="chart-wrap">
        <div id="statsChart"></div>
      </div>
    </div>

    <div id="emptyState" class="chart-panel empty" hidden>
      No servers tracked. Add a Discord invite code above.
    </div>
  </div>

  <script>
    const fmt = new Intl.NumberFormat("en-US");
    let servers = [];
    let selectedCode = null;
    let selectedHours = 24;
    let chart = null;

    const $ = (id) => document.getElementById(id);

    function showError(msg) {
      $("errorBox").textContent = msg || "";
      $("errorBox").hidden = !msg;
    }

    async function api(url, opts) {
      const res = await fetch(url, opts);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    async function loadServers() {
      servers = await api("/api/servers");
      if (!selectedCode && servers.length) selectedCode = servers[0].invite_code;
      if (selectedCode && !servers.some((s) => s.invite_code === selectedCode)) {
        selectedCode = servers[0]?.invite_code || null;
      }
      renderServers();
      if (selectedCode) await loadChart();
    }

    function renderServers() {
      const grid = $("serversGrid");
      grid.innerHTML = "";
      $("emptyState").hidden = servers.length > 0;
      $("chartPanel").hidden = servers.length === 0;

      for (const s of servers) {
        const card = document.createElement("div");
        card.className = `card ${s.invite_code === selectedCode ? "active" : ""}`;
        card.onclick = () => { selectedCode = s.invite_code; renderServers(); loadChart(); };

        const avatar = s.icon_url
          ? `<img class="server-avatar" src="${s.icon_url}" alt="" />`
          : `<div class="server-avatar"><svg class="icon" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>`;

        card.innerHTML = `
          <div class="card-head">
            <div class="server-info">
              ${avatar}
              <div style="min-width:0">
                <div class="server-name">${escapeHtml(s.name)}</div>
                <div class="server-code">discord.gg/${escapeHtml(s.invite_code)}</div>
              </div>
            </div>
            <button class="danger" title="Remove" data-del="${escapeHtml(s.invite_code)}">
              <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
            </button>
          </div>
          <div class="metrics">
            <div>
              <div class="metric-label"><span class="dot total"></span>Total</div>
              <div class="metric-value">${s.total_members != null ? fmt.format(s.total_members) : "-"}</div>
            </div>
            <div>
              <div class="metric-label"><span class="dot online"></span>Online</div>
              <div class="metric-value">${s.online_members != null ? fmt.format(s.online_members) : "-"}</div>
            </div>
          </div>
        `;

        card.querySelector("[data-del]").onclick = async (e) => {
          e.stopPropagation();
          await api(`/api/servers/${encodeURIComponent(s.invite_code)}`, { method: "DELETE" });
          await loadServers();
        };

        grid.appendChild(card);
      }
    }

    async function loadChart() {
      const current = servers.find((s) => s.invite_code === selectedCode);
      if (!current) return;

      $("chartTitle").textContent = current.name;
      $("lastUpdated").textContent = current.last_updated
        ? `Updated ${new Date(current.last_updated).toLocaleString("en-US")}`
        : "";

      const rows = await api(`/api/stats/${encodeURIComponent(selectedCode)}?hours=${selectedHours}`);
      const totalData = rows.map((r) => [new Date(r.timestamp).getTime(), r.total_members]);
      const onlineData = rows.map((r) => [new Date(r.timestamp).getTime(), r.online_members]);

      if (chart) chart.destroy();
      chart = new ApexCharts($("statsChart"), {
        chart: {
          type: "area",
          height: 340,
          background: "transparent",
          fontFamily: "inherit",
          toolbar: { show: true, tools: { download: false, selection: true, zoom: true, zoomin: true, zoomout: true, pan: true, reset: true } },
          animations: { enabled: true, speed: 350 },
        },
        theme: { mode: "dark" },
        colors: ["#5865f2", "#23a55a"],
        stroke: { curve: "smooth", width: 2.5 },
        fill: {
          type: "gradient",
          gradient: { shadeIntensity: 1, opacityFrom: 0.35, opacityTo: 0.02, stops: [0, 95, 100] },
        },
        dataLabels: { enabled: false },
        grid: { borderColor: "#1d2332", strokeDashArray: 4 },
        series: [
          { name: "Total", data: totalData },
          { name: "Online", data: onlineData },
        ],
        xaxis: {
          type: "datetime",
          labels: { datetimeUTC: false, style: { colors: "#8b95a7" } },
          axisBorder: { show: false },
          axisTicks: { show: false },
        },
        yaxis: [
          {
            labels: { style: { colors: "#8b95a7" }, formatter: (v) => fmt.format(Math.round(v)) },
          },
          {
            opposite: true,
            labels: { style: { colors: "#23a55a" }, formatter: (v) => fmt.format(Math.round(v)) },
          },
        ],
        tooltip: {
          theme: "dark",
          x: { format: "MMM dd, HH:mm" },
          y: { formatter: (v) => fmt.format(v) },
        },
        legend: { position: "top", horizontalAlign: "left", labels: { colors: "#e6e9ef" } },
      });
      chart.render();
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    $("addForm").onsubmit = async (e) => {
      e.preventDefault();
      showError("");
      const input = $("inviteInput");
      try {
        const added = await api("/api/servers", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ invite: input.value }),
        });
        input.value = "";
        selectedCode = added.invite_code;
        await loadServers();
      } catch (err) {
        showError(err.message);
      }
    };

    $("collectBtn").onclick = async () => {
      showError("");
      $("collectBtn").disabled = true;
      try {
        await api("/api/collect", { method: "POST" });
        await loadServers();
      } catch (err) {
        showError(err.message);
      } finally {
        $("collectBtn").disabled = false;
      }
    };

    $("rangeGroup").onclick = (e) => {
      const btn = e.target.closest("button[data-hours]");
      if (!btn) return;
      selectedHours = Number(btn.dataset.hours);
      for (const b of $("rangeGroup").querySelectorAll("button")) {
        b.classList.toggle("active", b === btn);
      }
      loadChart();
    };

    loadServers();
    setInterval(loadServers, 60_000);
  </script>
</body>
</html>
